AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: 釣果予測システム - データ更新と予測配信

Parameters:
  SourceBucketName:
    Type: String
    Default: data-daily-scraiping-choka
    Description: スクレイピングデータのS3バケット名
  DestBucketName:
    Type: String
    Default: fishing-catch-predictor
    Description: 予測システム用S3バケット名
  SnsTopicArn:
    Type: String
    Description: 予測結果配信用のSNSトピックARN
  AlertSnsTopicArn:
    Type: String
    Description: Lambda失敗アラート用のSNSトピックARN

Globals:
  Function:
    Timeout: 900
    MemorySize: 512
    Architectures:
      - x86_64

Resources:
  # --- Data Updater (EventBridge 経由の S3 イベント駆動、施設ごとに起動) ---
  DataUpdaterFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      Environment:
        Variables:
          SOURCE_BUCKET: !Ref SourceBucketName
          DEST_BUCKET: !Ref DestBucketName
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref SourceBucketName
        - S3CrudPolicy:
            BucketName: !Ref DestBucketName
      Events:
        S3BodyPut:
          Type: EventBridgeRule
          Properties:
            Pattern:
              source:
                - aws.s3
              detail-type:
                - Object Created
              detail:
                bucket:
                  name:
                    - !Ref SourceBucketName
                object:
                  key:
                    - wildcard: "data/honmoku*body.csv"
                    - wildcard: "data/daikoku*body.csv"
    Metadata:
      DockerTag: data-updater
      DockerContext: ./src/data_updater
      Dockerfile: Dockerfile

  # --- Initial Setup (手動実行のみ) ---
  InitialSetupFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageConfig:
        Command:
          - initial_setup.lambda_handler
      MemorySize: 1024
      Environment:
        Variables:
          SOURCE_BUCKET: !Ref SourceBucketName
          DEST_BUCKET: !Ref DestBucketName
          FACILITIES: honmoku,daikoku
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref SourceBucketName
        - S3CrudPolicy:
            BucketName: !Ref DestBucketName
    Metadata:
      DockerTag: initial-setup
      DockerContext: ./src/data_updater
      Dockerfile: Dockerfile

  # --- Predictor (EventBridge スケジュール駆動) ---
  PredictorFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      MemorySize: 1024
      Environment:
        Variables:
          S3_BUCKET_NAME: !Ref DestBucketName
          SNS_TOPIC_ARN: !Ref SnsTopicArn
          FACILITIES: honmoku,daikoku
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref DestBucketName
        - S3CrudPolicy:
            BucketName: !Ref DestBucketName
        - Statement:
            - Effect: Allow
              Action: sns:Publish
              Resource: !Ref SnsTopicArn
      Events:
        DailyPredict:
          Type: Schedule
          Properties:
            Schedule: cron(30 12 * * ? *)
            Description: 毎日 JST 21:30 に釣果予測を実行
    Metadata:
      DockerTag: predictor
      DockerContext: ./src/predictor
      Dockerfile: Dockerfile

  # --- CloudWatch Alarms (Lambda 失敗検知) ---
  PredictorErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-PredictorFunction-Errors"
      AlarmDescription: Predictor Lambda がエラーで終了した
      MetricName: Errors
      Namespace: AWS/Lambda
      Dimensions:
        - Name: FunctionName
          Value: !Ref PredictorFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertSnsTopicArn

  DataUpdaterErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-DataUpdaterFunction-Errors"
      AlarmDescription: DataUpdater Lambda がエラーで終了した
      MetricName: Errors
      Namespace: AWS/Lambda
      Dimensions:
        - Name: FunctionName
          Value: !Ref DataUpdaterFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertSnsTopicArn

Outputs:
  DataUpdaterFunctionArn:
    Description: Data Updater Lambda ARN
    Value: !GetAtt DataUpdaterFunction.Arn
  InitialSetupFunctionArn:
    Description: Initial Setup Lambda ARN
    Value: !GetAtt InitialSetupFunction.Arn
  PredictorFunctionArn:
    Description: Predictor Lambda ARN
    Value: !GetAtt PredictorFunction.Arn
  SnsTopicArn:
    Description: SNS Topic ARN
    Value: !Ref SnsTopicArn
